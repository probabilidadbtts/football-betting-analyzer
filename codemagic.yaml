workflows:
  python-android-apk:
    name: Build Python Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      python: 3.10
    scripts:
      - name: Install System Dependencies & Buildozer
        script: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev libssl-dev libffi-dev liblzma-dev build-essential ccache libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Build Android APK
        script: |
          yes | buildozer -v android debug
    artifacts:
      - bin/*.apk
